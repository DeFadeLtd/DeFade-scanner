name: Suggest a signal, chain or launchpad
description: Something DeFade should check, support or show.
title: "idea: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of idea
      options:
        - A new signal or module
        - A new chain
        - A new launchpad
        - Something in the apps, extension or bot
        - Something in the API or MCP connector
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find out about a token that DeFade doesn't show yet?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: What should DeFade check or show?
  - type: input
    id: example
    attributes:
      label: An example
      description: A token or wallet where this would have helped, if you have one.
